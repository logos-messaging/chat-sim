[package]
name = "chat-cli"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "logos-chat's chat client without a terminal, driven over pipes, with a model of the network on what it receives"

[[bin]]
name = "chat-cli"
path = "src/main.rs"

[dependencies]
# Workspace dependencies (sorted)
components = { workspace = true }
crossbeam-channel = { workspace = true }
logos-chat = { workspace = true }
message-types = { workspace = true }
network-model = { workspace = true }

# External dependencies (sorted)
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# External dependencies (sorted)
tempfile = "3"
