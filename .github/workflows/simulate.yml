name: Simulate
# The suite and the revision, so that a run in progress for a revision is
# found by its title.
run-name: Simulate ${{ inputs.suite }} at ${{ inputs.revision }}${{ inputs.pr != '' && format(' for logos-chat#{0}', inputs.pr) || '' }}

# Runs chat-sim's master at a logos-chat revision it is handed, in one of three
# suites. pr and main run the goal, a group grown toward epoch 50 by up to three
# members of any branch a round (tools/sim/scenarios/grow-waku-loss-*.json), on
# GroupV2 and, in the -groupv3 files, on GroupV3, at rates of loss. pr, for a
# logos-chat pull request, runs seeds 0 to 2 of each group at 0.5, 1 and 5%, a
# job a run, at the revision and at the base it is handed; the pair job then
# finds each group a run of which came out otherwise at the two, and the more
# job runs seeds 3 to 19 of each of its rates as well, at both, six a job. The
# run jobs of both are sweep.yml's. main runs seeds 0 to 2 of each group at no
# loss and seeds 0 to 19 at those three, ten a job, and no base.
# tools/sim matrix pairs each run with the base's of its scenario and seed,
# judges each rate of each group by a sign test on how far the first fork moved
# in its seeds, and says the verdict of each group; the comment is drawn from
# what it wrote, kept as the artifact matrix, and for pr says of each group what
# its runs at each rate came to. long runs the two scenarios of fifty epochs and
# every other one tools/sim/expected holds but the goal's on either group, as
# many runs as it holds, a job a scenario a side, and holds them to the base's
# runs, or without a base to what is held.
# The publish job keeps a main run on the Pages site as a point of main,
# logos-chat/main/<sha>/<measurement>/, with the point's page, and draws the
# graph over main, logos-chat/index.html, from every point again; it keeps a pr
# run for a pull request in logos-chat/pr-<N>/, with its report page and a page
# for each run; and it keeps a long run handed no base and no pr, held to what
# is expected, in logos-chat/long/<sha>/<measurement>/, with each scenario's
# compare and its page, and draws the graph over main again, which links the
# newest. Each keeps its runs' text, and the build's log of a job that could not
# build chat-sim. The comment links the page, and for a pr run the trees of its
# runs there and the graph over main.
# Main's points and the long runs are series the site shares, so only a run of
# the default branch keeps one; a pr run keeps its pull request's run from any
# branch.
# A main run handed a pr ran at the pull request's head, not at a commit of
# main: it keeps no point, and measure-main.yml does not wait on it.
# A pr run handed a pr posts the comment on that pull request of logos-chat as
# the App chat-sim, editing the App's oldest comment there or writing one. The
# post job does so after the publish job. A pr run handed check_run, the id of a
# check run the App made on logos-chat, moves it to in progress once the runs
# are planned, with this run as its details, and completes it with the groups'
# verdicts once the comment is posted, with the report page as its details, or
# this run without one: a failure when either group forks earlier, else a
# success when either forks later, and neutral otherwise; the repository
# variable CHAT_SIM_CHECK_REQUIRED set to true also fails it where chat-sim does
# not build at the revision or a run there has no outcome. The plan job and the
# post job each mint a token of their own, for logos-chat alone, from the
# variable CHAT_SIM_APP_CLIENT_ID and the secret CHAT_SIM_APP_PRIVATE_KEY;
# without them, each says so and posts nothing, and the comment is in the run's
# summary alone.
# logos-chat's chat-sim.yml starts pr when a pull request there is opened or
# pushed to, and main for each push to main; it can be started by hand too.
# Every hour, measure-main.yml starts main at logos-chat main's tip if the tip
# has no point at the current measurement, no run of main at it is going, and no
# run of main at it ended at that measurement without its point; and on Sundays,
# at the first tick that finds no run of long created that day, it starts long
# at the tip, unless the tip has its long run at the current measurement or a
# run of long is going.
# Only a dispatch starts it, never a pull_request event, so no fork's code
# reaches the publish job, which can push to gh-pages.
on:
  workflow_dispatch:
    inputs:
      revision:
        description: The logos-chat commit to run, its 40 hex digits
        required: true
      base:
        description: The logos-chat commit to compare with, its 40 hex digits, or nothing; main takes none
        required: false
      suite:
        description: The suite to run
        type: choice
        options: [pr, main, long]
        default: pr
      pr:
        description: The number of the logos-chat pull request the revision is of, or nothing
        required: false
      check_run:
        description: The id of the App's check run on logos-chat that the run completes, or nothing; pr alone, handed a pr
        required: false

permissions:
  contents: read

# A newer run of the same suite for the same pull request, or the same
# revision, cancels the one it supersedes. The suite is in the group, so that a
# main run and a long run of three hours at one revision never cancel each
# other.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.suite }}-${{ inputs.pr || inputs.revision }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan the runs
    runs-on: ubuntu-latest
    outputs:
      suite: ${{ steps.plan.outputs.suite }}
      revision: ${{ steps.plan.outputs.revision }}
      base: ${{ steps.plan.outputs.base }}
      pr: ${{ steps.plan.outputs.pr }}
      check_run: ${{ steps.plan.outputs.check_run }}
      runs: ${{ steps.plan.outputs.runs }}
      scenarios: ${{ steps.plan.outputs.scenarios }}
      measurement: ${{ steps.measured.outputs.measurement }}
    # Read by the script from the environment, never written into it: what the
    # workflow is handed is text whoever started it chose. The jobs after this
    # one read it from this job's outputs, once the script has checked it.
    env:
      SUITE: ${{ inputs.suite }}
      REVISION: ${{ inputs.revision }}
      BASE: ${{ inputs.base }}
      PR: ${{ inputs.pr }}
      CHECK_RUN: ${{ inputs.check_run }}
    steps:
      # The whole history, for the commit the runs measure. It is every
      # branch's, gh-pages and the text it publishes among them, so the clone
      # leaves out what the files hold but the checkout's.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Name the chat-sim commit the runs measure
        id: measured
        run: python3 .github/scripts/simulate.py measurement >> "$GITHUB_OUTPUT"
      - name: Check what the workflow was handed, and plan its runs
        id: plan
        run: |
          python3 .github/scripts/simulate.py plan --suite "$SUITE" --revision "$REVISION" \
            --base "$BASE" --pr "$PR" --check-run "$CHECK_RUN" --expected tools/sim/expected \
            >> "$GITHUB_OUTPUT"
      # The check run moves to in progress last: a step after it that failed
      # would leave it in progress with no post job to complete it. A step's
      # if cannot read a secret, so this step reads whether it is set.
      - name: Ask whether the App's client ID and key are set
        id: app
        if: ${{ steps.plan.outputs.check_run != '' }}
        env:
          CLIENT_ID: ${{ vars.CHAT_SIM_APP_CLIENT_ID }}
          KEY: ${{ secrets.CHAT_SIM_APP_PRIVATE_KEY != '' }}
        run: |
          if [ -n "$CLIENT_ID" ] && [ "$KEY" = true ]; then
            echo "set=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CHAT_SIM_APP_CLIENT_ID or CHAT_SIM_APP_PRIVATE_KEY is not set, so the check run is left as it is."
          fi
      - name: Mint a token for logos-chat's checks
        id: token
        if: ${{ steps.app.outputs.set == 'true' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CHAT_SIM_APP_CLIENT_ID }}
          private-key: ${{ secrets.CHAT_SIM_APP_PRIVATE_KEY }}
          owner: logos-messaging
          repositories: logos-chat
          permission-checks: write
      - name: Move the check run to in progress
        if: ${{ steps.token.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          CHECK_RUN: ${{ steps.plan.outputs.check_run }}
          RUNS: ${{ steps.plan.outputs.runs }}
        run: |
          printf '%s\n' "$RUNS" > "$RUNNER_TEMP/asked.json"
          python3 .github/scripts/simulate.py running --asked "$RUNNER_TEMP/asked.json" \
            --revision "$REVISION" --base "$BASE" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            > "$RUNNER_TEMP/check.json"
          gh api --silent -X PATCH "repos/logos-messaging/logos-chat/check-runs/$CHECK_RUN" \
            --input "$RUNNER_TEMP/check.json"

  # The run jobs, in sweep.yml, which more calls as well.
  run:
    name: Run
    needs: plan
    uses: ./.github/workflows/sweep.yml
    with:
      runs: ${{ needs.plan.outputs.runs }}

  # Runs when a run job fails as well, as the comment does: a run with no
  # outcome is a cell with none.
  pair:
    name: Pair seeds 0 to 2, and plan seeds 3 to 19 of each group whose runs moved
    needs: [plan, run]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' &&
      needs.plan.outputs.suite == 'pr' && needs.plan.outputs.base != '' }}
    runs-on: ubuntu-latest
    outputs:
      more: ${{ steps.widen.outputs.more }}
      asked: ${{ steps.widen.outputs.asked }}
    env:
      REVISION: ${{ needs.plan.outputs.revision }}
      BASE: ${{ needs.plan.outputs.base }}
      RUNS: ${{ needs.plan.outputs.runs }}
    steps:
      - uses: actions/checkout@v4
      - name: Download the runs at the revision
        uses: actions/download-artifact@v8
        with:
          pattern: sim-revision-*
          path: ${{ runner.temp }}/revision
      - name: Download the runs at the base
        uses: actions/download-artifact@v8
        with:
          pattern: sim-base-*
          path: ${{ runner.temp }}/base
      - name: Pair the runs, and plan the rest of the seeds of each group whose runs moved
        id: widen
        run: |
          mkdir -p "$RUNNER_TEMP/revision" "$RUNNER_TEMP/base"
          printf '%s\n' "$RUNS" > "$RUNNER_TEMP/asked.json"
          python3 tools/sim matrix "$RUNNER_TEMP/revision" --base "$RUNNER_TEMP/base" \
            --asked "$RUNNER_TEMP/asked.json" --out "$RUNNER_TEMP/matrix.json"
          python3 .github/scripts/simulate.py widen --matrix "$RUNNER_TEMP/matrix.json" \
            --asked "$RUNNER_TEMP/asked.json" --revision "$REVISION" --base "$BASE" \
            >> "$GITHUB_OUTPUT"

  # Skipped where no group's runs moved: a matrix of no job fails, and a
  # job's if is read before its matrix. It runs after a failed run job as
  # well, as pair does.
  more:
    name: Run more
    needs: pair
    if: >-
      ${{ !cancelled() && needs.pair.result == 'success' &&
      needs.pair.outputs.more != '[]' }}
    uses: ./.github/workflows/sweep.yml
    with:
      runs: ${{ needs.pair.outputs.more }}

  comment:
    name: Write the comment
    needs: [plan, run, pair, more]
    # Runs when a run job fails as well: the comment says which runs have no
    # outcome. It runs when pair and more are skipped too, for main and long,
    # and where no group's runs moved.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: read              # read the Pages site's address

    # For the post job: the report page's address.
    outputs:
      report: ${{ steps.report.outputs.url }}

    env:
      SUITE: ${{ needs.plan.outputs.suite }}
      REVISION: ${{ needs.plan.outputs.revision }}
      BASE: ${{ needs.plan.outputs.base }}
      PR: ${{ needs.plan.outputs.pr }}
      # The run jobs of both stages, or without pair those the plan printed.
      ASKED: ${{ needs.pair.outputs.asked || needs.plan.outputs.runs }}
      SCENARIOS: ${{ needs.plan.outputs.scenarios }}
      MEASUREMENT: ${{ needs.plan.outputs.measurement }}
    steps:
      - uses: actions/checkout@v4
      # Each job's artifact in a directory of its own, never merged: the jobs
      # of one scenario each wrote a sweep.json, and what reads a side reads
      # every run.json under it.
      - name: Download the runs at the revision
        uses: actions/download-artifact@v8
        with:
          pattern: sim-revision-*
          path: ${{ runner.temp }}/revision
      - name: Download the runs at the base
        if: ${{ needs.plan.outputs.base != '' }}
        uses: actions/download-artifact@v8
        with:
          pattern: sim-base-*
          path: ${{ runner.temp }}/base
      # Every run a run job was asked for, of both stages, is a cell, so that
      # one whose job uploaded nothing has no outcome; a side whose jobs
      # uploaded nothing has no runs.
      - name: Pair the runs, and say what moved
        if: ${{ needs.plan.outputs.suite != 'long' }}
        run: |
          mkdir -p "$RUNNER_TEMP/revision" "$RUNNER_TEMP/base"
          printf '%s\n' "$ASKED" > "$RUNNER_TEMP/asked.json"
          base=()
          if [ -n "$BASE" ]; then
            base=(--base "$RUNNER_TEMP/base")
          fi
          python3 tools/sim matrix "$RUNNER_TEMP/revision" "${base[@]}" \
            --asked "$RUNNER_TEMP/asked.json" --out "$RUNNER_TEMP/matrix.json"
      - name: Upload the matrix
        if: ${{ needs.plan.outputs.suite != 'long' }}
        uses: actions/upload-artifact@v7
        with:
          name: matrix
          path: ${{ runner.temp }}/matrix.json
      # compare's rows for each scenario of the long suite with something to
      # hold its runs to: the base's runs, or without a base what
      # tools/sim/expected holds. A side's sweeps are read at any depth: a
      # pattern that matches one artifact downloads it into the path itself.
      # Its output and the status it exited with go to compared/<scenario>/,
      # for the publish job, and its output beside the sweep, for the comment.
      - name: Hold each scenario's runs to the base's, or to what is held
        if: ${{ needs.plan.outputs.suite == 'long' }}
        run: |
          shopt -s globstar nullglob
          for name in $SCENARIOS; do
            for out in "$RUNNER_TEMP"/revision/**/"$name"; do
              was="tools/sim/expected/$name.json"
              if [ -n "$BASE" ]; then
                bases=("$RUNNER_TEMP"/base/**/"$name"/outcomes.json)
                was=${bases[0]-}
              fi
              if [ -f "$was" ] && [ -f "$out/outcomes.json" ]; then
                compared="$RUNNER_TEMP/compared/$name"
                mkdir -p "$compared"
                status=0
                python3 tools/sim compare "$was" "$out" > "$compared/compare.txt" 2>&1 || status=$?
                echo "$status" > "$compared/compare.status"
                cp "$compared/compare.txt" "$out/compare.txt"
              fi
            done
          done
      # None when no scenario had anything to hold its runs to, as when
      # chat-sim did not build.
      - name: Upload each scenario's compare
        if: ${{ needs.plan.outputs.suite == 'long' }}
        uses: actions/upload-artifact@v7
        with:
          name: compare
          path: ${{ runner.temp }}/compared/
          if-no-files-found: ignore
      # The page the publish job writes, where it writes one, as its condition
      # has it: a pull request's report, main's point, or a long run held to
      # what is expected. The site's address is read as guide.yml reads it.
      # Without it the comment goes out with no link, and the publish runs all
      # the same.
      - name: Read the report page's address
        id: report
        if: >-
          ${{ (needs.plan.outputs.suite == 'pr' && needs.plan.outputs.pr != '') ||
          (((needs.plan.outputs.suite == 'main' && needs.plan.outputs.pr == '') ||
          (needs.plan.outputs.suite == 'long' && needs.plan.outputs.base == '' &&
          needs.plan.outputs.pr == '')) &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url)" || {
            echo "::error::The Pages API gave no address for $GITHUB_REPOSITORY's site, so the comment does not link the report: is GitHub Pages on?"
            exit 1
          }
          page="logos-chat/$SUITE/$REVISION/$MEASUREMENT/"
          if [ "$SUITE" = pr ]; then
            page="logos-chat/pr-$PR/"
          fi
          echo "url=${url%/}/$page" >> "$GITHUB_OUTPUT"
      # The comment goes to comment.md, for the post job.
      - name: Write the comment
        env:
          REPORT_URL: ${{ steps.report.outputs.url }}
        run: |
          given=(--matrix "$RUNNER_TEMP/matrix.json")
          if [ "$SUITE" = long ]; then
            given=("$RUNNER_TEMP/revision")
          fi
          if [ -n "$BASE" ]; then
            given+=(--base "$BASE")
            if [ "$SUITE" = long ]; then
              given+=(--base-runs "$RUNNER_TEMP/base")
            fi
          fi
          if [ -n "$REPORT_URL" ]; then
            given+=(--report-url "$REPORT_URL")
          fi
          python3 .github/scripts/simulate.py comment "${given[@]}" \
            --suite "$SUITE" --revision "$REVISION" --pr "$PR" \
            --expected tools/sim/expected --chat-sim "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --out "$RUNNER_TEMP/comment.md"
          cat "$RUNNER_TEMP/comment.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the comment
        uses: actions/upload-artifact@v7
        with:
          name: comment
          path: ${{ runner.temp }}/comment.md

  publish:
    name: Publish to GitHub Pages
    needs: [plan, comment]
    # A pull request's run is kept by its number: a pr run handed none has no
    # place on the site. A point of main, and a long run, are measured by the
    # default branch; a long run handed a base holds its runs to the base's,
    # not to what is expected, and a main or long run handed a pr ran at its
    # head, not at a commit of main: neither is kept.
    if: >-
      ${{ !cancelled() && needs.comment.result == 'success' &&
      ((((needs.plan.outputs.suite == 'main' && needs.plan.outputs.pr == '') ||
      (needs.plan.outputs.suite == 'long' && needs.plan.outputs.base == '' &&
      needs.plan.outputs.pr == '')) &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (needs.plan.outputs.suite == 'pr' && needs.plan.outputs.pr != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write          # push to the gh-pages branch

    # Serialize with the other jobs that publish to gh-pages, queued as they are.
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
      queue: max

    env:
      SUITE: ${{ needs.plan.outputs.suite }}
      REVISION: ${{ needs.plan.outputs.revision }}
      BASE: ${{ needs.plan.outputs.base }}
      PR: ${{ needs.plan.outputs.pr }}
      MEASUREMENT: ${{ needs.plan.outputs.measurement }}

    steps:
      # The tree that ran, whose .github/scripts/pages.py writes what it ran.
      # The one page the site shares that it writes is the graph over main, and
      # only a run of the default branch keeps a point or a long run and draws
      # it.
      - uses: actions/checkout@v4

      # Fails when there is no gh-pages branch, which is made once, by hand.
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Download the matrix
        if: ${{ needs.plan.outputs.suite != 'long' }}
        uses: actions/download-artifact@v8
        with:
          name: matrix
          path: ${{ runner.temp }}/matrix
      # By a pattern, which matches nothing where the comment job uploaded
      # none; pages.py reads each scenario's at any depth.
      - name: Download each scenario's compare
        if: ${{ needs.plan.outputs.suite == 'long' }}
        uses: actions/download-artifact@v8
        with:
          pattern: compare
          path: ${{ runner.temp }}/compared
      # Each job's artifact in a directory of its own, as the comment job has
      # them: the jobs of one scenario each wrote a sweep.json.
      - name: Download the runs at the revision
        uses: actions/download-artifact@v8
        with:
          pattern: sim-revision-*
          path: ${{ runner.temp }}/revision
      - name: Download the runs at the base
        if: ${{ needs.plan.outputs.base != '' }}
        uses: actions/download-artifact@v8
        with:
          pattern: sim-base-*
          path: ${{ runner.temp }}/base

      - name: Find the point this one follows
        id: previous
        if: ${{ needs.plan.outputs.suite == 'main' }}
        run: |
          python3 .github/scripts/pages.py previous site --revision "$REVISION" \
            --measurement "$MEASUREMENT" --run-number "$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
      # The pull requests merged since that point, from logos-chat's public
      # API, which the job's own token reads.
      - name: Ask logos-chat for its commits since that point
        if: ${{ steps.previous.outputs.previous != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ steps.previous.outputs.previous }}
        run: |
          gh api "repos/logos-messaging/logos-chat/compare/$PREVIOUS...$REVISION" \
            > "$RUNNER_TEMP/commits.json"

      - name: Write the point, and prune the text of the points past the newest eleven
        if: ${{ needs.plan.outputs.suite == 'main' }}
        run: |
          mkdir -p "$RUNNER_TEMP/revision"
          commits=()
          if [ -f "$RUNNER_TEMP/commits.json" ]; then
            commits=(--commits "$RUNNER_TEMP/commits.json")
          fi
          python3 .github/scripts/pages.py point "$RUNNER_TEMP/matrix/matrix.json" \
            "$RUNNER_TEMP/revision" site "${commits[@]}" \
            --revision "$REVISION" --measurement "$MEASUREMENT" --chat-sim "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --run-number "$GITHUB_RUN_NUMBER" --time "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: Write the long run, and prune the text of the long runs past the newest fifteen
        if: ${{ needs.plan.outputs.suite == 'long' }}
        run: |
          mkdir -p "$RUNNER_TEMP/revision" "$RUNNER_TEMP/compared"
          python3 .github/scripts/pages.py long "$RUNNER_TEMP/revision" site \
            --compared "$RUNNER_TEMP/compared" --expected tools/sim/expected \
            --scenarios tools/sim/scenarios \
            --revision "$REVISION" --measurement "$MEASUREMENT" --chat-sim "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --run-number "$GITHUB_RUN_NUMBER" --time "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      # Of a long run as well, so that its link moves on a Sunday with no point.
      - name: Draw the graph over main from every point
        if: ${{ needs.plan.outputs.suite != 'pr' }}
        run: python3 .github/scripts/pages.py trend site
      - name: Write the pull request's run
        if: ${{ needs.plan.outputs.suite == 'pr' }}
        run: |
          mkdir -p "$RUNNER_TEMP/revision" "$RUNNER_TEMP/base"
          base=()
          if [ -n "$BASE" ]; then
            base=(--base "$BASE" --base-runs "$RUNNER_TEMP/base")
          fi
          python3 .github/scripts/pages.py pr "$RUNNER_TEMP/matrix/matrix.json" \
            "$RUNNER_TEMP/revision" site --pr "$PR" "${base[@]}" \
            --scenarios tools/sim/scenarios \
            --revision "$REVISION" --measurement "$MEASUREMENT" --chat-sim "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --run-number "$GITHUB_RUN_NUMBER" --time "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Push to gh-pages
        run: |
          said="the point of logos-chat main $REVISION at $MEASUREMENT"
          if [ "$SUITE" = pr ]; then
            said="the run of logos-chat#$PR ($REVISION)"
          elif [ "$SUITE" = long ]; then
            said="the long run of logos-chat main $REVISION at $MEASUREMENT"
          fi
          git -C site add -A
          if git -C site diff --cached --quiet; then
            echo "gh-pages already holds $said, or a newer run's."
            exit 0
          fi
          git -C site config user.name "github-actions[bot]"
          git -C site config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C site commit -qm "Publish $said"
          git -C site push origin gh-pages

  post:
    name: Post the comment and complete the check
    needs: [plan, comment, publish]
    # After publish, so that the report the comment links is pushed when the
    # comment lands. It runs whether publish succeeded, failed or was skipped,
    # so that the check run is completed all the same.
    if: >-
      ${{ !cancelled() && needs.comment.result == 'success' &&
      needs.plan.outputs.suite == 'pr' && needs.plan.outputs.pr != '' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      PR: ${{ needs.plan.outputs.pr }}
      CHECK_RUN: ${{ needs.plan.outputs.check_run }}

    steps:
      # The tree that ran, whose .github/scripts/simulate.py says where the
      # comment goes and writes the check's update.
      - uses: actions/checkout@v4
      - name: Download the comment
        uses: actions/download-artifact@v8
        with:
          name: comment
          path: ${{ runner.temp }}
      - name: Download the matrix
        uses: actions/download-artifact@v8
        with:
          name: matrix
          path: ${{ runner.temp }}
      # The comment on the pull request, and the check run, through a token of
      # this job's own. A step's if cannot read a secret, so this step reads
      # whether it is set.
      - name: Ask whether the App's client ID and key are set
        id: app
        env:
          CLIENT_ID: ${{ vars.CHAT_SIM_APP_CLIENT_ID }}
          KEY: ${{ secrets.CHAT_SIM_APP_PRIVATE_KEY != '' }}
        run: |
          if [ -n "$CLIENT_ID" ] && [ "$KEY" = true ]; then
            echo "set=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CHAT_SIM_APP_CLIENT_ID or CHAT_SIM_APP_PRIVATE_KEY is not set, so nothing is posted on logos-chat: the comment is in the run's summary."
          fi
      - name: Mint a token for logos-chat's pull request and its checks
        id: token
        if: ${{ steps.app.outputs.set == 'true' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CHAT_SIM_APP_CLIENT_ID }}
          private-key: ${{ secrets.CHAT_SIM_APP_PRIVATE_KEY }}
          owner: logos-messaging
          repositories: logos-chat
          permission-checks: write
          permission-pull-requests: write
      - name: Find the App's comment on the pull request
        id: posting
        if: ${{ steps.token.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          LOGIN: ${{ steps.token.outputs.app-slug }}[bot]
        run: |
          gh api --paginate --slurp "repos/logos-messaging/logos-chat/issues/$PR/comments" \
            > "$RUNNER_TEMP/comments.json"
          python3 .github/scripts/simulate.py post --comments "$RUNNER_TEMP/comments.json" \
            --login "$LOGIN" --pr "$PR" --comment "$RUNNER_TEMP/comment.md" \
            --out "$RUNNER_TEMP/posted.json" >> "$GITHUB_OUTPUT"
      - name: Edit the App's comment on the pull request, or write it
        if: ${{ steps.token.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          METHOD: ${{ steps.posting.outputs.method }}
          ENDPOINT: ${{ steps.posting.outputs.endpoint }}
        run: gh api --silent -X "$METHOD" "$ENDPOINT" --input "$RUNNER_TEMP/posted.json"
      # A run cancelled leaves the check run in progress, and so does a comment
      # job that failed, or this one before this step, until it runs again.
      - name: Complete the check run with the verdict
        if: ${{ steps.token.outcome == 'success' && needs.plan.outputs.check_run != '' }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPORT_URL: ${{ needs.comment.outputs.report }}
          REQUIRED: ${{ vars.CHAT_SIM_CHECK_REQUIRED }}
        run: |
          given=()
          if [ -n "$REPORT_URL" ]; then
            given+=(--report-url "$REPORT_URL")
          fi
          python3 .github/scripts/simulate.py check --matrix "$RUNNER_TEMP/matrix.json" \
            --comment "$RUNNER_TEMP/comment.md" --required "$REQUIRED" "${given[@]}" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            > "$RUNNER_TEMP/check.json"
          gh api --silent -X PATCH "repos/logos-messaging/logos-chat/check-runs/$CHECK_RUN" \
            --input "$RUNNER_TEMP/check.json"
