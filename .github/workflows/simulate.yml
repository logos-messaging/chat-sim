name: Simulate
# The suite and the revision, so that a run in progress for a revision is
# found by its title.
run-name: Simulate ${{ inputs.suite }} at ${{ inputs.revision }}${{ inputs.pr != '' && format(' for logos-chat#{0}', inputs.pr) || '' }}

# Runs chat-sim's master at a logos-chat revision it is handed, in one of three
# suites. pr and main run the goal, a group of 51 that saro grows toward epoch
# 50 (tools/sim/scenarios/50-epochs-by-saro-waku-loss-*.json), at rates of
# loss. pr, for a logos-chat pull request, runs seeds 0 and 1 at 0.1, 1 and 5%,
# a job a run, at the revision and at the base it is handed; when gh-pages holds
# main's point at the base at the current measurement, with an outcome at each
# of those runs, its runs, main's first two seeds, stand in for the base's and
# no job runs at the base. main runs
# seeds 0 to 19 at no loss and at those three, two jobs of ten a rate, and no
# base. tools/sim matrix pairs each run with the base's of its scenario and
# seed and says the verdict, and for pr places the head's runs among main's
# twenty seeds of the point at the base, or of the nearest before it; the
# comment is drawn from what it wrote, kept as the artifact matrix. long runs
# the two scenarios of fifty epochs and every other one tools/sim/expected
# holds but the goal's, as many runs as it holds, a job a scenario a side, and
# holds them to the base's runs, or without a base to what is held.
# The publish job keeps a main run on the Pages site as a point of main,
# logos-chat/main/<sha>/<measurement>/, with the point's page, and draws the
# graph over main, logos-chat/index.html, from every point again; it keeps a pr
# run for a pull request in logos-chat/pr-<N>/, with its report page. Each
# keeps its runs' text, and the build's log of a job that could not build
# chat-sim; the long suite keeps nothing. The comment links the page.
# Main's points are a series the site shares, so only a run of the default
# branch keeps one; a pr run keeps its pull request's run from any branch.
# A main run handed a pr ran at the pull request's head, not at a commit of
# main: it keeps no point, and measure-main.yml does not wait on it.
# Started by hand until an app can start it from logos-chat and post the
# comment there. Every hour, measure-main.yml starts main at logos-chat main's
# tip if the tip has no point at the current measurement, no run at it handed
# no pr is going, and no such run of main ended at that measurement without its
# point.
# Only a dispatch starts it, never a pull_request event, so no fork's code
# reaches the publish job, which can push to gh-pages.
on:
  workflow_dispatch:
    inputs:
      revision:
        description: The logos-chat commit to run, its 40 hex digits
        required: true
      base:
        description: The logos-chat commit to compare with, its 40 hex digits, or nothing; main takes none
        required: false
      suite:
        description: The suite to run
        type: choice
        options: [pr, main, long]
        default: pr
      pr:
        description: The number of the logos-chat pull request the revision is of, or nothing
        required: false

permissions:
  contents: read

# A newer run for the same pull request, or the same revision, cancels the one
# it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.pr || inputs.revision }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Plan the runs
    runs-on: ubuntu-latest
    outputs:
      suite: ${{ steps.plan.outputs.suite }}
      revision: ${{ steps.plan.outputs.revision }}
      base: ${{ steps.plan.outputs.base }}
      pr: ${{ steps.plan.outputs.pr }}
      runs: ${{ steps.plan.outputs.runs }}
      scenarios: ${{ steps.plan.outputs.scenarios }}
      # Where on gh-pages main's point is that stands in for the base's runs,
      # and the one the head's runs are placed among: the same, or else the one
      # at the base or the nearest before it that can be read.
      point: ${{ steps.plan.outputs.point }}
      spread: ${{ steps.plan.outputs.point || steps.spread.outputs.spread }}
      measurement: ${{ steps.measured.outputs.measurement }}
    # Read by the script from the environment, never written into it: what the
    # workflow is handed is text whoever started it chose. The jobs after this
    # one read it from this job's outputs, once the script has checked it.
    env:
      SUITE: ${{ inputs.suite }}
      REVISION: ${{ inputs.revision }}
      BASE: ${{ inputs.base }}
      PR: ${{ inputs.pr }}
    steps:
      # The whole history, for the commit the runs measure, and gh-pages's tree,
      # for the points of main. It is every branch's, gh-pages and the text it
      # publishes among them, so the clone leaves out what the files hold but
      # the checkout's. git fetches a point.json when the job reads it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Name the chat-sim commit the runs measure
        id: measured
        run: python3 .github/scripts/simulate.py measurement >> "$GITHUB_OUTPUT"
      - name: List the points of main on gh-pages
        run: git ls-tree -r --name-only origin/gh-pages -- logos-chat/main > "$RUNNER_TEMP/points"
      - name: Check what the workflow was handed, and plan its runs
        id: plan
        env:
          MEASUREMENT: ${{ steps.measured.outputs.measurement }}
        run: |
          python3 .github/scripts/simulate.py plan --suite "$SUITE" --revision "$REVISION" \
            --base "$BASE" --pr "$PR" --expected tools/sim/expected \
            --measurement "$MEASUREMENT" --points "$RUNNER_TEMP/points" --pages origin/gh-pages \
            >> "$GITHUB_OUTPUT"
      # The base's hundred newest commits, itself first, from logos-chat's public
      # API, which the job's own token reads. The plan has checked the base.
      - name: Ask logos-chat for the base's history
        if: ${{ steps.plan.outputs.suite == 'pr' && steps.plan.outputs.base != '' && steps.plan.outputs.point == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/logos-messaging/logos-chat/commits?sha=$BASE&per_page=100" \
            > "$RUNNER_TEMP/history.json"
      - name: Find main's point nearest before the base
        id: spread
        if: ${{ steps.plan.outputs.suite == 'pr' && steps.plan.outputs.base != '' && steps.plan.outputs.point == '' }}
        env:
          MEASUREMENT: ${{ steps.measured.outputs.measurement }}
        run: |
          python3 .github/scripts/simulate.py spread --measurement "$MEASUREMENT" \
            --points "$RUNNER_TEMP/points" --history "$RUNNER_TEMP/history.json" \
            --pages origin/gh-pages >> "$GITHUB_OUTPUT"

  run:
    name: Run at ${{ matrix.run.name }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJSON(needs.plan.outputs.runs) }}
    env:
      REVISION: ${{ matrix.run.revision }}
      SCENARIO: ${{ matrix.run.scenario }}
      FROM: ${{ matrix.run.from }}
      RUNS: ${{ matrix.run.runs }}
    steps:
      - uses: actions/checkout@v4
      - uses: logos-co/setup-nix-cache-action@v1
      # Both pins, which ci.yml's Lint holds to one revision: the flake's input,
      # whose lock gives the toolchain, and Cargo.toml's git dependencies, which
      # cargo locks again on the build.
      - name: Pin logos-chat at the revision
        run: |
          pinned=$(jq -r '.nodes."logos-chat".locked.rev' flake.lock)
          sed -i "s/$pinned/$REVISION/g" flake.nix Cargo.toml
          nix flake lock
      # The dev shell's toolchain on PATH, for rust-cache's key as well.
      - uses: nicknovitski/nix-develop@v1
      # The build of every dependency from an earlier run, at any revision of
      # logos-chat, so that only its crates and chat-sim's build again.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: harness-run
      # Its output is kept as build.log, for the report of a revision chat-sim
      # does not build at.
      - name: Build harness-run
        id: build
        shell: bash
        run: |
          cargo build --release -p harness --bin harness-run 2>&1 | tee "$RUNNER_TEMP/build.log"
          flake=$(jq -r '.nodes."logos-chat".locked.rev' flake.lock)
          cargo=$(grep -o 'logos-chat?rev=[0-9a-f]*' Cargo.lock | sort -u)
          echo "flake.lock pins logos-chat at $flake, Cargo.lock at: $cargo" \
            | tee -a "$RUNNER_TEMP/build.log"
          [ "$flake" = "$REVISION" ] && [ "$cargo" = "logos-chat?rev=$REVISION" ]
      # A revision chat-sim does not build at runs nothing: each run the job was
      # to do says so in the directory the sweep would have given it, for the
      # comment, beside the build's log, for the report.
      - name: Mark the runs unbuilt
        if: ${{ failure() && steps.build.outcome == 'failure' }}
        run: |
          last=$((FROM + RUNS - 1))
          for ((number = FROM; number <= last; number++)); do
            out="$RUNNER_TEMP/sim/$SCENARIO/$(printf '%0*d' "${#last}" "$number")"
            mkdir -p "$out"
            echo "chat-sim does not build at $REVISION" > "$out/unbuilt"
            # CARGO_TERM_COLOR puts colour codes in the log; the page shows it as text.
            sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' "$RUNNER_TEMP/build.log" > "$out/build.log"
          done
      # Runs FROM to FROM + RUNS - 1 of the scenario's sweep, each with the
      # seeds it has in a sweep from run 1, and writes their outcomes for
      # compare. A sweep that does not go as its scenario expects fails the job
      # once the outcomes are written.
      - name: Run the scenario
        run: |
          status=0
          out="$RUNNER_TEMP/sim/$SCENARIO"
          python3 tools/sim sweep "tools/sim/scenarios/$SCENARIO.json" --from "$FROM" \
            --runs "$RUNS" --one-process target/release/harness-run --out "$out" || status=1
          python3 tools/sim compare --write "$out/outcomes.json" "$out" || status=1
          exit "$status"
      # The sweep's files and its runs', without each run's group.log,
      # plan.json, result.json, runner.out and runner.stderr, in the directory
      # named for the scenario, or the build's log beside each unbuilt marker.
      # Each job's under a name of its own: two jobs of one scenario each wrote
      # a sweep.json.
      - name: Upload the runs' text
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: sim-${{ matrix.run.side }}-${{ matrix.run.scenario }}-${{ matrix.run.from }}
          path: |
            ${{ runner.temp }}/sim/*/sweep.txt
            ${{ runner.temp }}/sim/*/sweep.json
            ${{ runner.temp }}/sim/*/outcomes.json
            ${{ runner.temp }}/sim/*/*/unbuilt
            ${{ runner.temp }}/sim/*/*/build.log
            ${{ runner.temp }}/sim/*/*/run.txt
            ${{ runner.temp }}/sim/*/*/run.json
            ${{ runner.temp }}/sim/*/*/report.txt
            ${{ runner.temp }}/sim/*/*/report.json
            ${{ runner.temp }}/sim/*/*/expect.json

  comment:
    name: Write the comment
    needs: [plan, run]
    # Runs when a run job fails as well: the comment says which runs have no
    # outcome.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: read              # read the Pages site's address

    env:
      SUITE: ${{ needs.plan.outputs.suite }}
      REVISION: ${{ needs.plan.outputs.revision }}
      BASE: ${{ needs.plan.outputs.base }}
      PR: ${{ needs.plan.outputs.pr }}
      RUNS: ${{ needs.plan.outputs.runs }}
      SCENARIOS: ${{ needs.plan.outputs.scenarios }}
      POINT: ${{ needs.plan.outputs.point }}
      SPREAD: ${{ needs.plan.outputs.spread }}
      MEASUREMENT: ${{ needs.plan.outputs.measurement }}
    steps:
      - uses: actions/checkout@v4
      # Each job's artifact in a directory of its own, never merged: the jobs
      # of one scenario each wrote a sweep.json, and what reads a side reads
      # every run.json under it.
      - name: Download the runs at the revision
        uses: actions/download-artifact@v8
        with:
          pattern: sim-revision-*
          path: ${{ runner.temp }}/revision
      - name: Download the runs at the base
        if: ${{ needs.plan.outputs.base != '' && needs.plan.outputs.point == '' }}
        uses: actions/download-artifact@v8
        with:
          pattern: sim-base-*
          path: ${{ runner.temp }}/base
      # The points of main the plan chose, from the gh-pages branch, which the
      # job's own token reads: Pages serves the branch minutes late.
      - name: Read main's points the plan chose
        if: ${{ needs.plan.outputs.spread != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          raw=(-H "Accept: application/vnd.github.raw+json")
          gh api "${raw[@]}" "repos/$GITHUB_REPOSITORY/contents/$SPREAD?ref=gh-pages" \
            > "$RUNNER_TEMP/spread.json"
          if [ -n "$POINT" ]; then
            gh api "${raw[@]}" "repos/$GITHUB_REPOSITORY/contents/$POINT?ref=gh-pages" \
              > "$RUNNER_TEMP/point.json"
          fi
      # Every run the plan asked for is a cell, so that one whose job uploaded
      # nothing has no outcome; a side whose jobs uploaded nothing has no runs.
      # Main's point at the base, where the plan found one, is the base's side.
      - name: Pair the runs, and say what moved
        if: ${{ needs.plan.outputs.suite != 'long' }}
        run: |
          mkdir -p "$RUNNER_TEMP/revision" "$RUNNER_TEMP/base"
          printf '%s\n' "$RUNS" > "$RUNNER_TEMP/asked.json"
          base=()
          if [ -n "$POINT" ]; then
            base=(--base-point "$RUNNER_TEMP/point.json")
          elif [ -n "$BASE" ]; then
            base=(--base "$RUNNER_TEMP/base")
          fi
          spread=()
          if [ -n "$SPREAD" ]; then
            spread=(--spread "$RUNNER_TEMP/spread.json")
          fi
          python3 tools/sim matrix "$RUNNER_TEMP/revision" "${base[@]}" "${spread[@]}" \
            --asked "$RUNNER_TEMP/asked.json" --out "$RUNNER_TEMP/matrix.json"
      - name: Upload the matrix
        if: ${{ needs.plan.outputs.suite != 'long' }}
        uses: actions/upload-artifact@v7
        with:
          name: matrix
          path: ${{ runner.temp }}/matrix.json
      # compare's rows for each scenario of the long suite with something to
      # hold its runs to: the base's runs, or without a base what
      # tools/sim/expected holds. A side's sweeps are read at any depth: a
      # pattern that matches one artifact downloads it into the path itself.
      - name: Hold each scenario's runs to the base's, or to what is held
        if: ${{ needs.plan.outputs.suite == 'long' }}
        run: |
          shopt -s globstar nullglob
          for name in $SCENARIOS; do
            for out in "$RUNNER_TEMP"/revision/**/"$name"; do
              was="tools/sim/expected/$name.json"
              if [ -n "$BASE" ]; then
                bases=("$RUNNER_TEMP"/base/**/"$name"/outcomes.json)
                was=${bases[0]-}
              fi
              if [ -f "$was" ] && [ -f "$out/outcomes.json" ]; then
                python3 tools/sim compare "$was" "$out" > "$out/compare.txt" 2>&1 || true
              fi
            done
          done
      # The page the publish job writes, where it writes one, as its condition
      # has it: a pull request's report, or main's point. The site's address
      # is read as guide.yml reads it. Without it the comment goes out with no
      # link, and the publish runs all the same.
      - name: Read the report page's address
        id: report
        if: >-
          ${{ (needs.plan.outputs.suite == 'pr' && needs.plan.outputs.pr != '') ||
          (needs.plan.outputs.suite == 'main' && needs.plan.outputs.pr == '' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url)" || {
            echo "::error::The Pages API gave no address for $GITHUB_REPOSITORY's site, so the comment does not link the report: is GitHub Pages on?"
            exit 1
          }
          page="logos-chat/main/$REVISION/$MEASUREMENT/"
          if [ "$SUITE" = pr ]; then
            page="logos-chat/pr-$PR/"
          fi
          echo "url=${url%/}/$page" >> "$GITHUB_OUTPUT"
      - name: Write the comment
        env:
          REPORT_URL: ${{ steps.report.outputs.url }}
        run: |
          given=(--matrix "$RUNNER_TEMP/matrix.json")
          if [ "$SUITE" = long ]; then
            given=("$RUNNER_TEMP/revision")
          fi
          if [ -n "$BASE" ]; then
            given+=(--base "$BASE")
            if [ "$SUITE" = long ]; then
              given+=(--base-runs "$RUNNER_TEMP/base")
            fi
          fi
          if [ -n "$REPORT_URL" ]; then
            given+=(--report-url "$REPORT_URL")
          fi
          python3 .github/scripts/simulate.py comment "${given[@]}" \
            --suite "$SUITE" --revision "$REVISION" --pr "$PR" \
            --expected tools/sim/expected --chat-sim "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            > "$RUNNER_TEMP/comment.md"
          cat "$RUNNER_TEMP/comment.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the comment
        uses: actions/upload-artifact@v7
        with:
          name: comment
          path: ${{ runner.temp }}/comment.md

  publish:
    name: Publish to GitHub Pages
    needs: [plan, comment]
    # A pull request's run is kept by its number: a pr run handed none has no
    # place on the site. A point of main is measured by the default branch, and
    # a main run handed a pr ran at its head, not at a commit of main: it is not
    # kept.
    if: >-
      ${{ !cancelled() && needs.comment.result == 'success' &&
      ((needs.plan.outputs.suite == 'main' && needs.plan.outputs.pr == '' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (needs.plan.outputs.suite == 'pr' && needs.plan.outputs.pr != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write          # push to the gh-pages branch

    # Serialize with the other jobs that publish to gh-pages, queued as they are.
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
      queue: max

    env:
      SUITE: ${{ needs.plan.outputs.suite }}
      REVISION: ${{ needs.plan.outputs.revision }}
      BASE: ${{ needs.plan.outputs.base }}
      PR: ${{ needs.plan.outputs.pr }}
      MEASUREMENT: ${{ needs.plan.outputs.measurement }}

    steps:
      # The tree that ran, whose .github/scripts/pages.py writes what it ran.
      # The one page the site shares that it writes is the graph over main, and
      # only a run of the default branch keeps a point and draws it.
      - uses: actions/checkout@v4

      # Fails when there is no gh-pages branch, which is made once, by hand.
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Download the matrix
        uses: actions/download-artifact@v8
        with:
          name: matrix
          path: ${{ runner.temp }}/matrix
      # Each job's artifact in a directory of its own, as the comment job has
      # them: the jobs of one scenario each wrote a sweep.json.
      - name: Download the runs at the revision
        uses: actions/download-artifact@v8
        with:
          pattern: sim-revision-*
          path: ${{ runner.temp }}/revision
      - name: Download the runs at the base
        if: ${{ needs.plan.outputs.base != '' && needs.plan.outputs.point == '' }}
        uses: actions/download-artifact@v8
        with:
          pattern: sim-base-*
          path: ${{ runner.temp }}/base

      - name: Find the point this one follows
        id: previous
        if: ${{ needs.plan.outputs.suite == 'main' }}
        run: |
          python3 .github/scripts/pages.py previous site --revision "$REVISION" \
            --measurement "$MEASUREMENT" --run-number "$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
      # The pull requests merged since that point, from logos-chat's public
      # API, which the job's own token reads.
      - name: Ask logos-chat for its commits since that point
        if: ${{ steps.previous.outputs.previous != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ steps.previous.outputs.previous }}
        run: |
          gh api "repos/logos-messaging/logos-chat/compare/$PREVIOUS...$REVISION" \
            > "$RUNNER_TEMP/commits.json"

      - name: Write the point, and prune the text of the points past the newest thirty
        if: ${{ needs.plan.outputs.suite == 'main' }}
        run: |
          mkdir -p "$RUNNER_TEMP/revision"
          commits=()
          if [ -f "$RUNNER_TEMP/commits.json" ]; then
            commits=(--commits "$RUNNER_TEMP/commits.json")
          fi
          python3 .github/scripts/pages.py point "$RUNNER_TEMP/matrix/matrix.json" \
            "$RUNNER_TEMP/revision" site "${commits[@]}" \
            --revision "$REVISION" --measurement "$MEASUREMENT" --chat-sim "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --run-number "$GITHUB_RUN_NUMBER" --time "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: Draw the graph over main from every point
        if: ${{ needs.plan.outputs.suite == 'main' }}
        run: python3 .github/scripts/pages.py trend site
      # Where main's point stood in for the base, no run at the base was
      # downloaded: the point's own directory holds its runs' text.
      - name: Write the pull request's run
        if: ${{ needs.plan.outputs.suite == 'pr' }}
        run: |
          mkdir -p "$RUNNER_TEMP/revision" "$RUNNER_TEMP/base"
          base=()
          if [ -n "$BASE" ]; then
            base=(--base "$BASE" --base-runs "$RUNNER_TEMP/base")
          fi
          python3 .github/scripts/pages.py pr "$RUNNER_TEMP/matrix/matrix.json" \
            "$RUNNER_TEMP/revision" site --pr "$PR" "${base[@]}" \
            --revision "$REVISION" --measurement "$MEASUREMENT" --chat-sim "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --run-number "$GITHUB_RUN_NUMBER" --time "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Push to gh-pages
        run: |
          said="the point of logos-chat main $REVISION at $MEASUREMENT"
          if [ "$SUITE" = pr ]; then
            said="the run of logos-chat#$PR ($REVISION)"
          fi
          git -C site add -A
          if git -C site diff --cached --quiet; then
            echo "gh-pages already holds $said, or a newer run's."
            exit 0
          fi
          git -C site config user.name "github-actions[bot]"
          git -C site config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C site commit -qm "Publish $said"
          git -C site push origin gh-pages
